# Test config file for Load_Config tests
# Provider selection
provider=openai

# OpenRouter settings
openrouter_endpoint=https://test-router.example.com/api/v1/chat
openrouter_model=test-model-v2
openrouter_temperature=0.5
openrouter_max_tokens=2048
openrouter_site_url=https://test-site.example.com
openrouter_app_name=TestApp

# OpenAI settings
openai_endpoint=https://test-openai.example.com/v1/chat
openai_model=gpt-4-test
openai_temperature=0.3
openai_max_tokens=512

# Proxy settings (shared)
proxy_mode=socks5
proxy_host=192.168.1.100
proxy_port=10808
proxy_user=proxyuser
proxy_pass=proxypass
